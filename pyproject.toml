[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firefox-mcp"
version = "0.3.0"
description = "Attach-only WebDriver BiDi MCP server for driving your own Firefox."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "websockets>=13"]

[project.optional-dependencies]
# The suite itself is stdlib unittest and needs nothing extra; pytest is here only
# because it gives nicer failure output. Either runner works:
#   python -m unittest discover -s tests -t .
#   python -m pytest tests
dev = ["pytest>=8"]

[project.scripts]
firefox-mcp = "firefox_mcp.server:main"

[tool.setuptools]
packages = ["firefox_mcp"]
